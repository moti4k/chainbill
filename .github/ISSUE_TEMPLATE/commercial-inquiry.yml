name: Commercial inquiry
description: Request a scoped ChainBill integration or implementation engagement.
title: "Commercial inquiry: "
labels:
  - commercial-inquiry
body:
  - type: markdown
    attributes:
      value: |
        ChainBill integration and implementation support is offered at 200 USDC per month. Keep this issue free of private keys, seed phrases, credentials, personal documents, and other secrets.
  - type: input
    id: project_url
    attributes:
      label: Public project URL
      description: Link to the repository, product, or public specification.
      placeholder: https://github.com/owner/repository
    validations:
      required: true
  - type: textarea
    id: requested_outcome
    attributes:
      label: Requested outcome
      description: Describe the smallest useful result you want delivered.
    validations:
      required: true
  - type: input
    id: payment_rail
    attributes:
      label: Target network and token
      placeholder: Base USDC
    validations:
      required: true
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance criteria
      description: List the observable conditions that will make the work complete.
    validations:
      required: true
  - type: checkboxes
    id: terms
    attributes:
      label: Engagement boundaries
      options:
        - label: I understand that the service never requests custody, seed phrases, or private keys.
          required: true
        - label: I understand that paid infrastructure and third-party fees are outside the 200 USDC monthly package unless agreed explicitly.
          required: true
